name: One-time folder migration generation
on:
  push:
    branches: [feat/drive-folders-upload-recovery]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Neuroklast/doc-archive' && !contains(github.event.head_commit.message, 'build: generate folder migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      - name: Commit migration files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add drizzle/
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: generate folder migration [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/drive-folders-upload-recovery
