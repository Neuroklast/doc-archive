name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-never-use-for-production-123
      BETTER_AUTH_URL: http://localhost:3000
      ARCHIVE_OWNER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Ensure migration files match Drizzle schema
        run: test -z "$(git status --porcelain -- drizzle/)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
