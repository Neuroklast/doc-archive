name: Generate initial reproducible setup
on:
  push:
    branches:
      - feat/document-upload-ocr-drive
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Neuroklast/doc-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without repository credentials
        run: npm install --no-audit --no-fund
      - name: Generate reviewed baseline migration
        run: npm run db:generate
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      - name: Commit exact generated outputs to this feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- package-lock.json drizzle/
          if git diff --cached --quiet; then
            echo "Artifacts already committed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock dependencies and initial schema [skip ci]'
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:refs/heads/feat/document-upload-ocr-drive
